spring:
  application:
    name: bookmind-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/bookmind?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-init-sql: SET time_zone = '+08:00'

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME}
    password: ${RABBIT_PASSWORD}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET:book-files}

  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

  ai:
    autoconfigure:
      exclude:
        - org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration
        - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
    openai:
      base-url: https://api.siliconflow.cn
      api-key: ${SILICONFLOW_KEY_CHAT}
      chat:
        options:
          temperature: 0.7
          max-tokens: 4096
      embedding:
        options:
          model: BAAI/bge-m3
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        vector-size: 1024
    mcp:
      client:
        enabled: true
        stdio:
          servers-configuration: classpath:mcp-servers.json

sensenova:
  api:
    base-url: https://token.sensenova.cn/v1
    chat-key: ${SENSENOVA_API_KEY}
    kg-key: ${SENSENOVA_API_KEY_KG}
    chat-model: sensenova-6.7-flash-lite
    tool-model: deepseek-v4-flash
    kg-model: deepseek-v4-flash
    ocr-model: sensenova-6.7-flash-lite
    u1-model: sensenova-u1-fast

siliconflow:
  api:
    base-url: https://api.siliconflow.cn/v1
    chat-key: ${SILICONFLOW_KEY_CHAT}
    embed-key: ${SILICONFLOW_KEY_EMBED}
    special-key: ${SILICONFLOW_KEY_SPECIAL}
    chat-model: Qwen/Qwen3-8B
    embed-model: BAAI/bge-m3
    special-model: THUDM/GLM-Z1-9B-0414
    rerank-model: BAAI/bge-reranker-v2-m3
    ocr-model: deepseek-ai/DeepSeek-OCR

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

spring.jackson:
  time-zone: Asia/Shanghai

logging:
  level:
    ai.bookmind: INFO
    org.springframework.ai: WARN

bookmind:
  ai:
    chat-provider: ${AI_PROVIDER:sensenova}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400}
  upload:
    max-size: 5120
    allowed-types: pdf,docx,txt,epub,md
  max-file-size-pdf: 500
  max-file-size-txt: 100
  max-file-size-md: 100
  max-file-size-docx: 200
  max-file-size-epub: 200
  vector:
    chunk-size: 500
    chunk-overlap: 150
  ratelimit:
    ai-chat: ${RATE_LIMIT_CHAT:60}
    upload: ${RATE_LIMIT_UPLOAD:10}
    search: ${RATE_LIMIT_SEARCH:100}
  qdrant:
    http-port: 6333
