services:
  mysql:
    image: mysql:8.0.39
    container_name: bookmind-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: bookmind
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/memory-limit.cnf
    networks:
      - BookMind

  redis:
    image: redis:7-alpine
    container_name: bookmind-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 0 --appendonly yes --save ""
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - BookMind

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: bookmind-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - BookMind

  minio:
    image: minio/minio
    container_name: bookmind-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - BookMind

  qdrant:
    image: qdrant/qdrant:latest
    container_name: bookmind-qdrant
    restart: always
    environment:
      QDRANT__STORAGE__OPTIMIZERS__MEMORY_MAP: "false"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - BookMind

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  minio-data:
  qdrant-data:

networks:
  BookMind:
    name: BookMind
    driver: bridge