# ============================================
# BookMind Nginx 配置 — zreo.top
# 部署: cp 到 /etc/nginx/sites-available/bookmind
# 启用: ln -s /etc/nginx/sites-available/bookmind /etc/nginx/sites-enabled/
# SSL: certbot --nginx -d zreo.top -d www.zreo.top
# ============================================

upstream bookmind_backend {
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    server_name zreo.top www.zreo.top;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name zreo.top www.zreo.top;

    # SSL — certbot 自动生成
    ssl_certificate     /etc/letsencrypt/live/zreo.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zreo.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # 前端静态文件
    root /opt/bookmind/frontend/dist;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # ===== 后端 API（含 SSE 流式对话） =====
    location /api/ {
        proxy_pass http://bookmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: 必须关 buffering，否则流式断
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # ===== MinIO 文件直链（封面/书籍文件） =====
    location /files/ {
        proxy_pass http://127.0.0.1:9000/book-files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # ===== 前端 SPA =====
    location / {
        try_files $uri $uri/ /index.html;

        # 静态资源缓存（一年）
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # 拒绝敏感路径
    location ~ /\.(git|env|env\.) {
        deny all;
    }
    location ~ /\.env {
        deny all;
    }
}
